name: Atualizar Letterboxd

on:
  schedule:
    - cron: "17 */6 * * *"   # a cada 6 horas
  workflow_dispatch: {}       # botão "Run workflow" manual

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-letterboxd.mjs
      - name: Commit se mudou
        run: |
          if git diff --quiet -- data/letterboxd.js; then
            echo "Sem filmes novos."
            exit 0
          fi
          git config user.name "letterboxd-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/letterboxd.js
          git commit -m "Atualiza filmes do Letterboxd"
          git push
